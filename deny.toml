# cargo-deny: licenses, advisories, bans and sources.
# Run with `cargo deny check`, or scripts/test-ci-locally.sh.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
# wgpu, winit and the image stack pull several versions of the same crates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via ratatui-wgpu (rustybuzz) and winit (sctk-adwaita/ab_glyph), window feature only" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via ratatui-wgpu, window feature only" },
]
